name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Job 1: Use GoReleaser to build all platforms
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload macOS artifacts for DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/*darwin*

  # Job 2: Create DMG on macOS
  create-dmg:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist

      - name: Extract and create DMG
        run: |
          # List downloaded files for debugging
          echo "Contents of dist directory:"
          ls -la dist/

          # Find the Darwin universal tarball
          TARBALL=$(find dist -name "*Darwin_universal.tar.gz" -type f | head -n 1)
          echo "Found tarball: $TARBALL"

          # Extract Universal Binary
          mkdir -p dmg-source
          tar -xzf "$TARBALL" -C dmg-source

          # Verify extraction
          echo "Contents of dmg-source:"
          ls -la dmg-source/

          # Create DMG using hdiutil (built-in macOS tool, no GUI needed)
          DMG_NAME="stock-monitor_${{ github.ref_name }}_macOS_universal.dmg"

          hdiutil create -volname "Stock Monitor" -srcfolder dmg-source -ov -format UDZO "$DMG_NAME"

          echo "DMG created successfully: $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          fail_on_unmatched_files: true
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
